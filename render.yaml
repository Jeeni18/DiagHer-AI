services:
  - type: web
    name: diagher-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:create_app()" --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      # numpy 1.25 / scikit-learn 1.3 need Python 3.10-3.11
      - key: PYTHON_VERSION
        value: 3.10.11
