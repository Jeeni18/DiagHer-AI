services:
  - type: web
    name: diagher-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:create_app()" --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      # Match the local venv the model was trained with
      - key: PYTHON_VERSION
        value: 3.10.11
